spring.application.name=BookApplication

# ===================================================================
# Server Configuration
# ===================================================================
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Replace 'bookdb' with your MySQL database name
spring.datasource.url=jdbc:mysql://localhost:3306/bookdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=kuldeep@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Hibernate DDL auto creation strategy:
# - 'update': Updates the schema without deleting existing data (Recommended for dev)
# - 'create-drop': Creates schema on start and drops on shutdown
# - 'none': No schema changes (Recommended for production)
spring.jpa.hibernate.ddl-auto=update

# Shows formatted SQL queries in console logs for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Platform Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect